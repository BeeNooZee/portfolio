name: Déploiement

# Pousser sur main (ou lancer manuellement) déploie le portfolio sur la VM
# via un runner auto-hébergé (étiquette « portfolio ») sur 192.168.1.117.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, portfolio]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déployer
        run: bash deploy/deploy.sh "$GITHUB_WORKSPACE"
